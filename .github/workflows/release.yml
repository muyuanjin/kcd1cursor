name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Configure Windows x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Package plugin and licenses
        run: |
          Copy-Item -LiteralPath build/_deps/minhook-src/LICENSE.txt -Destination build/MinHook-LICENSE.txt
          Compress-Archive -LiteralPath build/Release/kcd1cursor.asi, LICENSE, build/MinHook-LICENSE.txt -DestinationPath build/kcd1cursor.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" build/kcd1cursor.zip --verify-tag --title "$env:RELEASE_TAG" --generate-notes
